# =====================================================
# シュミネーター 趣味図鑑ページ自動生成ワークフロー
# 置き場所:リポジトリの .github/workflows/build-pages.yml
# 動き:hobbies.js か videos.js が更新されたとき(または手動実行時)に
#       build_pages.js を走らせ、全趣味の個別ページ・図鑑一覧・
#       sitemap.xml を生成して自動コミットする。
#       → 1000ページを手でアップロードする必要はない。
# =====================================================
name: build-pages

on:
  push:
    paths:
      - "hobbies.js"
      - "videos.js"
      - "build_pages.js"
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: build-pages        # 同時に2つ走らせない
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 図鑑ページを生成
        run: node build_pages.js
      - name: 生成物をコミット
        run: |
          git config user.name "shuminator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "趣味図鑑ページ自動生成"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi

# =====================================================
# シュミネーター 趣味図鑑ページ自動生成ワークフロー
# 置き場所:リポジトリの .github/workflows/build-pages.yml
# 動き:hobbies.js か videos.js か build_pages.js が更新されたとき
#       (または手動実行時)に build_pages.js を走らせ、
#       全趣味の個別ページ・一覧・おすすめ・飽きた・季節・sitemap.xml を
#       生成して自動コミットする。
#
# ★ 2026-09 追加：next/ bored/ と季節ページを git add に含めた。
#    ここに入れ忘れると、生成されてもコミットされず404になる
#    （過去に random.html で同じ事故が起きている）。
# =====================================================
name: build-pages

on:
  push:
    paths:
      - "hobbies.js"
      - "videos.js"
      - "build_pages.js"
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: build-pages        # 同時に2つ走らせない
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 図鑑ページを生成
        run: node build_pages.js
      - name: 生成物をコミット
        run: |
          git config user.name "shuminator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A hobby next bored
          git add *.html llms.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "趣味図鑑ページ自動生成"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi
